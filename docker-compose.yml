
name: steepwise

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: steepwise-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-steepwise}
      POSTGRES_USER: ${POSTGRES_USER:-steepwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - steepwise-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: steepwise-backend
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-steepwise}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-steepwise}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - steepwise-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: steepwise-frontend
    restart: unless-stopped

    environment:
      VITE_API_URL: http://localhost:8080/api/v1

    ports:
      - "127.0.0.1:5173:5173"

    depends_on:
      - backend

    networks:
      - steepwise-network

volumes:
  postgres_data:

networks:
  steepwise-network:
    driver: bridge
