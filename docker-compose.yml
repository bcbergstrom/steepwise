
name: steepwise

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: steepwise-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-steepwise}
      POSTGRES_USER: ${POSTGRES_USER:-steepwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - steepwise-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: steepwise-backend
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: docker
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STEEPWISE_AI_MODEL: ${STEEPWISE_AI_MODEL:-gpt-4.1-mini}
      STEEPWISE_PUBLIC_URL: ${STEEPWISE_PUBLIC_URL:-http://localhost:5173}
      STEEPWISE_MAIL_FROM: ${STEEPWISE_MAIL_FROM:-}
      STEEPWISE_EMAIL_TRANSPORT: ${STEEPWISE_EMAIL_TRANSPORT:-smtp}
      STEEPWISE_CLOUDFLARE_ACCOUNT_ID: ${STEEPWISE_CLOUDFLARE_ACCOUNT_ID:-}
      STEEPWISE_CLOUDFLARE_EMAIL_TOKEN: ${STEEPWISE_CLOUDFLARE_EMAIL_TOKEN:-}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${STEEPWISE_SECURE_COOKIE:-false}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-localhost}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-25}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_STARTTLS:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: ${SPRING_MAIL_STARTTLS:-false}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-steepwise}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-steepwise}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - steepwise-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SPRING_AUTH: ${STEEPWISE_SPRING_AUTH:-false}
      secrets:
        - frontend_env

    container_name: steepwise-frontend
    restart: unless-stopped

    env_file:
      - ./frontend/.env

    networks:
      - steepwise-network

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend
    networks:
      - steepwise-network

secrets:
  frontend_env:
    file: ./frontend/.env

volumes:
  postgres_data:

networks:
  steepwise-network:
    driver: bridge
