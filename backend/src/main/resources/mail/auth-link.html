<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{heading}}</title>
</head>
<body style="margin:0;padding:0;background:#f3efe6;color:#3a3027;font-family:Arial,sans-serif">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#f3efe6">
    <tr><td align="center" style="padding:32px 16px">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#fffcf5"
        style="max-width:540px;border:1px solid #dcd5c5;border-top:4px solid #4b6348;border-radius:10px">
        <tr><td style="padding:32px 28px">
          <p style="margin:0;color:#4b6348;font-size:12px;font-weight:bold;letter-spacing:3px;text-transform:uppercase">Steep AI</p>
          <h1 style="margin:16px 0 12px;font-family:Georgia,serif;font-size:34px;line-height:1.15;font-weight:normal">{{heading}}</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:1.6">{{description}}</p>
          <table role="presentation" cellspacing="0" cellpadding="0" border="0">
            <tr><td bgcolor="#4b6348" style="border-radius:6px">
              <a href="{{url}}" style="display:inline-block;padding:13px 22px;border:1px solid #4b6348;border-radius:6px;color:#fffaf0;font-size:16px;font-weight:bold;text-decoration:none">{{button}}</a>
            </td></tr>
          </table>
          <p style="margin:20px 0 0;color:#61564b;font-size:14px;line-height:1.5">{{link_note}}</p>
          <p style="margin:24px 0 0;padding-top:18px;border-top:1px solid #e3dccd;color:#61564b;font-size:13px;line-height:1.5">
            {{ignore_note}}
          </p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
