
spring:
  application:
    name: steepwise

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/steepwise}
    username: ${SPRING_DATASOURCE_USERNAME:steepwise}
    password: ${SPRING_DATASOURCE_PASSWORD:steepwise}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080
