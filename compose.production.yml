services:
  postgres:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      STEEPWISE_PUBLIC_URL: https://steepai.app
      STEEPWISE_MAIL_FROM: sign-in@steepai.app
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: framework

  frontend:
    build:
      args:
        VITE_SPRING_AUTH: "true"

  gateway:
    environment:
      SITE_ADDRESS: steepai.app
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data

volumes:
  caddy_data:
